server {
    listen 80;
    listen [::]:80;
    server_name potrait.takaloka.in;
    location ^~ /.well-known/acme-challenge/ { root /var/www/loka-acme; }
    location / { return 301 https://potrait.takaloka.in$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name potrait.takaloka.in;
    ssl_certificate /etc/letsencrypt/live/potrait.takaloka.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/potrait.takaloka.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    access_log /var/log/nginx/loka-portrait.access.log;
    error_log /var/log/nginx/loka-portrait.error.log;
    location ^~ /.well-known/acme-challenge/ { root /var/www/loka-acme; }
    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host potrait.takaloka.in;
        proxy_set_header X-Forwarded-Host potrait.takaloka.in;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 420s;
        proxy_buffering off;
    }
}
